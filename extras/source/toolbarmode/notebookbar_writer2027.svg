<svg width="321" height="125" viewBox="0 0 321 125" xmlns="http://www.w3.org/2000/svg">
  <!-- Writer 2027 UI mode preview: calm dark canvas, tabbed header, document stage -->
  <rect x="0" y="0" width="321" height="125" fill="#1e1f24"/>
  <!-- notebookbar header row -->
  <rect x="0" y="0" width="321" height="34" fill="#2b2d33"/>
  <rect x="0" y="33" width="321" height="1.5" fill="#3a3d45"/>
  <!-- tabs -->
  <rect x="10" y="6" width="52" height="22" rx="3" fill="#3f424b"/>
  <text x="20" y="21" font-family="Inter, sans-serif" font-size="11" fill="#e8e8ec">File</text>
  <rect x="68" y="6" width="56" height="22" rx="3" fill="#3f424b"/>
  <text x="78" y="21" font-family="Inter, sans-serif" font-size="11" fill="#e8e8ec">Home</text>
  <rect x="130" y="6" width="60" height="22" rx="3" fill="#3f424b"/>
  <text x="140" y="21" font-family="Inter, sans-serif" font-size="11" fill="#e8e8ec">Insert</text>
  <rect x="196" y="6" width="52" height="22" rx="3" fill="#3f424b"/>
  <text x="206" y="21" font-family="Inter, sans-serif" font-size="11" fill="#e8e8ec">View</text>
  <!-- document stage (golden-ratio dominant) -->
  <rect x="16" y="46" width="205" height="70" rx="1.5" fill="#2e3138"/>
  <rect x="24" y="54" width="180" height="54" rx="1" fill="#f6f4ef"/>
  <!-- body text lines on page -->
  <rect x="34" y="68" width="120" height="4" rx="2" fill="#c9c6bd"/>
  <rect x="34" y="78" width="150" height="4" rx="2" fill="#d6d3c9"/>
  <rect x="34" y="88" width="100" height="4" rx="2" fill="#d6d3c9"/>
  <!-- contextual sidebar (auxiliary region) -->
  <rect x="231" y="46" width="74" height="70" rx="1.5" fill="#26272c"/>
  <rect x="239" y="54" width="58" height="6" rx="1.5" fill="#3a3d45"/>
  <rect x="239" y="66" width="58" height="6" rx="1.5" fill="#33363d"/>
  <rect x="239" y="78" width="42" height="6" rx="1.5" fill="#33363d"/>
  <rect x="239" y="90" width="52" height="6" rx="1.5" fill="#33363d"/>
</svg>