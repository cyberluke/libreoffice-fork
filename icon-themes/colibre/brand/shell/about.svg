<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Brand mark spheres. Identical gradients to assets/logos/officelabs-mark.svg
         so the About splash, the launcher icon and the landing mark are one artwork. -->
    <radialGradient id="s1" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <radialGradient id="s2" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </radialGradient>
    <radialGradient id="s3" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- Decorative teal accent bar at top -->
  <rect x="0" y="0" width="300" height="4" fill="url(#accentGrad)"/>

  <!-- Subtle geometric pattern -->
  <g opacity="0.06">
    <polygon points="150,20 280,95 280,245 150,320 20,245 20,95" fill="none" stroke="#0D9488" stroke-width="1"/>
    <polygon points="150,50 250,105 250,215 150,270 50,215 50,105" fill="none" stroke="#0D9488" stroke-width="1"/>
    <polygon points="150,80 220,115 220,185 150,220 80,185 80,115" fill="none" stroke="#0D9488" stroke-width="1"/>
  </g>

  <!-- Brand mark, centred where the old diamond sat. The mark is authored on a
       48x48 grid, so scale(1.75) renders it 84px wide and the translate puts its
       centre (24,24) at (150,120). -->
  <g transform="translate(108, 78) scale(1.75)">
    <circle cx="16" cy="18" r="10" fill="url(#s1)"/>
    <circle cx="32" cy="18" r="10" fill="url(#s2)"/>
    <circle cx="24" cy="32" r="10" fill="url(#s3)"/>
  </g>

  <!-- OfficeLabs text -->
  <text x="150" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9" letter-spacing="1">OfficeLabs</text>

  <!-- Tagline -->
  <text x="150" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="2">AI-POWERED OFFICE SUITE</text>

  <!-- Bottom accent line -->
  <line x1="100" y1="250" x2="200" y2="250" stroke="#0D9488" stroke-width="1" opacity="0.5"/>
</svg>
