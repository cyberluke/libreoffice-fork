# OfficeLabs macOS build. LibreOfficeMacOSX.conf plus OfficeLabs identity.
--enable-epm
--enable-scripting-beanshell
--enable-scripting-javascript
--enable-ext-nlpsolver
--enable-extension-integration
--without-system-postgresql
--with-help=html
--with-myspell-dicts
--with-package-format=dmg
--enable-odk
--enable-mergelibs=more
INCLUDE:OfficeLabsBranding
# LibreOfficeMacOSX.conf enables online update; OfficeLabs ships its own
# update path, and leaving it on would make a clean configure FAIL —
# configure.ac requires --with-privacy-policy-url whenever online update
# or breakpad is enabled. Re-enable only together with an OfficeLabs
# privacy-policy URL *and* an OfficeLabs update endpoint, since the
# default still points at update.libreoffice.org
# (instsetoo_native/util/openoffice.lst.in).
--disable-online-update
# Without this the bundle identifier defaults to org.libreoffice.script,
# which collides with a stock LibreOffice install in LaunchServices and
# splits TCC permission grants across two identities.
--with-macosx-bundle-identifier=ai.officelabs.app
