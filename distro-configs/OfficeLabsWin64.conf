# OfficeLabs Windows x64 build. LibreOfficeWin64.conf plus OfficeLabs identity.
--host=x86_64-pc-cygwin
--without-junit
--without-helppack-integration
--enable-extension-integration
--enable-scripting-beanshell
--enable-scripting-javascript
--enable-ext-wiki-publisher
--enable-ext-nlpsolver
--with-help=html
--with-myspell-dicts
--with-package-format=msi
--enable-mergelibs=more
--enable-lto
--enable-odk
INCLUDE:OfficeLabsBranding
# LibreOfficeWin64.conf enables online update, the MAR updater and breakpad.
# configure.ac requires --with-privacy-policy-url whenever online update OR
# breakpad is on, so leaving any of them enabled makes a clean configure FAIL.
# OfficeLabs has neither a privacy-policy URL nor an update endpoint yet, and
# the default endpoint still points at update.libreoffice.org
# (instsetoo_native/util/openoffice.lst.in). Re-enable only together with both.
--disable-online-update
--disable-breakpad
# No --with-macosx-bundle-identifier here: configure.ac registers it
# unconditionally so it would be accepted, but it is only ever read inside the
# Darwin branch, so setting it on Windows would be silently meaningless.
# Platform-specific branding belongs in the per-platform config.
