# NAI Office (LibreOffice fork) -- Linux product build configuration.
#
# Usage: ./autogen.sh --with-distro=NAIOfficeLinux
# (or let v271/build_linux.sh drive the whole build; see v271/README.md)
#
# Linux notes:
#   * No CEF flag: the Linux WebView uses WebKitGTK, not CEF.
#   * Installer format is DEB (requires dpkg tooling on the build
#     host). For a plain dev build (no installer) drop the
#     --with-package-format line.
#   * Requires the LO Linux build prerequisites (see
#     https://wiki.documentfoundation.org/Development/BuildingOnLinux).
#   * --enable-naioffice-cpu-opt is OFF by default on Linux; pass it
#     explicitly to compile for AVX2 + SSE4.1 + SSE4.2 (x86-64 only).
--enable-python=internal
--without-java
--disable-odk
--disable-online-update
--disable-extension-update
--disable-report-builder
--disable-scripting-beanshell
--disable-scripting-javascript
--without-help
--with-lang=cs en-US sk vi
--enable-officelabs-ai
--with-package-format=deb