# NAI Office (LibreOffice fork) -- macOS product build configuration.
#
# Usage: ./autogen.sh --with-distro=NAIOfficeMac
# (or let v271/build_mac.sh drive the whole build; see v271/README.md)
#
# macOS notes:
#   * No CEF flag: the macOS WebView uses WKWebView, not CEF.
#   * Installer format is DMG. For a plain dev build (no installer)
#     drop the --with-package-format line.
#   * Requires Xcode + the LO macOS build prerequisites (see
#     https://wiki.documentfoundation.org/Development/BuildingOnMac).
#   * --enable-naioffice-cpu-opt is OFF on macOS by default (ARM64
#     hosts cannot use x86 SIMD flags); pass it explicitly only for
#     Intel Macs.
--enable-python=internal
--without-java
--disable-odk
--disable-online-update
--disable-extension-update
--disable-report-builder
--disable-scripting-beanshell
--disable-scripting-javascript
--without-help
--with-lang=cs en-US sk vi
--enable-officelabs-ai
--with-package-format=dmg