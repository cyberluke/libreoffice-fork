# NAI Office product identity — platform-neutral.
# INCLUDE this from every per-platform NAI Office config so the product
# name and vendor can never drift between the mac, Windows and CI builds.
# Platform-specific branding (macOS bundle identifier, Windows .ico
# resources) belongs in the per-platform config, not here.
#
# The product name contains a space ("NAI Office"); configure computes
# PRODUCTNAME_WITHOUT_SPACES ("NAIOffice") for bundle/installer/SDK names.
#
# --enable-release-build is load-bearing, not cosmetic: without it
# PRODUCTNAME gains a "Dev" suffix, so the app ships as NAI OfficeDev
# with a separate user-profile directory.
--with-product-name=NAI Office
--with-vendor=NAI Office
--enable-release-build
